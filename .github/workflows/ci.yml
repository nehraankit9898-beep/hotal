# StayLoop CI — every push + PR.
#
# Deployment gate: production deploy MUST be blocked when any critical step
# below fails (branch protection: require this workflow to pass).
#
# Audit fix 7: the old "Migration validation" step ran `prisma migrate diff
# || true` and only checked that an SQL file exists — it could never fail.
# This pipeline APPLIES the migrations to a clean PostgreSQL 16 service,
# verifies migrations == schema (empty diff, via a shadow database), and runs
# a full integration suite (web + worker + export + backup + restore)
# against the live database. Docker build + startup + health + Trivy scans
# close the loop.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  BUN_VERSION: "1.3.14"

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — enables secret scanning of removed lines

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # 1. Frozen dependency installation (audit fix: lockfile drift fails CI)
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # 2. Explicit Prisma generation for the DEV schema (SQLite) — the test
      #    server runs against SQLite. The PostgreSQL client is generated
      #    explicitly in the migration + docker jobs.
      - name: Prisma generate (SQLite dev schema)
        run: bunx prisma generate --schema prisma/schema.prisma

      # 3. Dependency audit (fail on high/critical)
      - name: Dependency audit
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit --omit=dev --audit-level=high

      # 4. Secret detection
      - name: Secret scan
        run: bun run scripts/scan-secrets.ts

      # 5. Static analysis
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint

      # 6. Unit + integration + security tests (server + SQLite DB, per-file
      #    isolation with the watchdog — see scripts/run-tests.ts)
      - name: Tests (SQLite security + functional suites)
        run: bun run test
        env:
          REDIS_URL: redis://127.0.0.1:6379

      # 7. Production build (build-time env only; no production secrets)
      - name: Production build
        run: bun run build
        env:
          DATABASE_URL: file:../db/ci.db

  postgres-migrations:
    runs-on: ubuntu-latest
    needs: quality-and-security
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stayloop
          POSTGRES_PASSWORD: cipassword
          POSTGRES_DB: stayloop_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stayloop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://stayloop:cipassword@127.0.0.1:5432/stayloop_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # Explicit Prisma generation for the PRODUCTION schema (PostgreSQL).
      - name: Prisma generate (PostgreSQL production schema)
        run: bunx prisma generate --schema prisma/schema.postgres.prisma

      # AUDIT FIX: apply every migration to a CLEAN PostgreSQL 16 database.
      # `migrate deploy` is non-destructive and fails on any error — no
      # `|| true` masking.
      - name: Apply migrations to clean PostgreSQL 16
        run: bunx prisma migrate deploy --schema prisma/schema.postgres.prisma

      # AUDIT FIX: real schema validation — the migrations directory must
      # match schema.postgres.prisma EXACTLY (empty diff via shadow database).
      - name: Migrations match schema (empty diff)
        run: |
          bunx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.postgres.prisma \
            --shadow-database-url "postgresql://stayloop:cipassword@127.0.0.1:5432/postgres" \
            > /tmp/drift.sql
          if [ -s /tmp/drift.sql ] && grep -qE "^(CREATE|ALTER|DROP)" /tmp/drift.sql; then
            echo "Schema drift between prisma/migrations and schema.postgres.prisma:"
            cat /tmp/drift.sql
            exit 1
          fi
          echo "No drift: migrations and schema are consistent."

      # Final schema sanity: the Phase 10 tables exist after migration.
      - name: Verify final schema (Phase 10 tables present)
        run: |
          PGPASSWORD=cipassword psql -h 127.0.0.1 -U stayloop -d stayloop_ci -tAc "
            SELECT table_name FROM information_schema.tables
            WHERE table_schema='public'
              AND table_name IN ('BackupRecord','BackgroundJob','PlatformSetting','Payment','Subscription','Plan','User','Hotel')
            ORDER BY table_name;" > /tmp/tables.txt
          cat /tmp/tables.txt
          test "$(wc -l < /tmp/tables.txt)" -eq 8

  postgres-integration:
    runs-on: ubuntu-latest
    needs: postgres-migrations
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stayloop
          POSTGRES_PASSWORD: cipassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stayloop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_ADMIN_URL: postgresql://stayloop:cipassword@127.0.0.1:5432/postgres
      PG_APP_URL: postgresql://stayloop:cipassword@127.0.0.1:5432/stayloop_ci
      PG_SHADOW_URL: postgresql://stayloop:cipassword@127.0.0.1:5432/stayloop_shadow
      PG_RESTORE_URL: postgresql://stayloop:cipassword@127.0.0.1:5432/stayloop_restore
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Prisma generate (PostgreSQL production schema)
        run: bunx prisma generate --schema prisma/schema.postgres.prisma

      # pg_dump/pg_restore 16 must exist wherever backups execute.
      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          pg_dump --version

      - name: Production build (standalone server)
        run: bun run build
        env:
          DATABASE_URL: file:../db/ci.db

      # Full end-to-end suite against live PostgreSQL 16 + Redis:
      # migrations, schema consistency, web boot, worker heartbeat,
      # super-admin bootstrap→password change→MFA→dashboard, export
      # enqueue→worker→download (incl. cross-tenant 404 / bad token 403),
      # backup pg_dump→encrypt→verify→RESTORE into a disposable database.
      - name: PostgreSQL end-to-end integration suite
        run: bun run scripts/test-pg-integration.ts

  docker:
    runs-on: ubuntu-latest
    needs: postgres-migrations
    steps:
      - uses: actions/checkout@v4

      - name: Build production images
        run: |
          # AUDIT FIX (deploy-2): the LAST stage in the Dockerfile is
          # admin-bootstrap, so a build WITHOUT --target produces the ADMIN
          # image — not web. Every web image build must pass --target web
          # (the worker build already passed --target worker).
          docker build --target web -t stayloop-web:ci .
          docker build --target worker -t stayloop-worker:ci .

      - name: Trivy vulnerability scan (web)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: stayloop-web:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"

      - name: Trivy vulnerability scan (worker)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: stayloop-worker:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"

      # Full stack startup: postgres + redis + migrate + web + worker with
      # healthchecks, then probe the real endpoints. Uses ONLY generated
      # test secrets (no real credentials anywhere).
      - name: Compose stack startup + health checks
        run: |
          # Minimal production-shape environment (test secrets, fail-closed
          # validation still applies: strong-length secrets, PostgreSQL URL).
          cat > .env <<'EOF'
          NODE_ENV=production
          DATABASE_PASSWORD=citestpassword0123456789abcdef
          POSTGRES_USER=stayloop
          POSTGRES_DB=stayloop
          DATABASE_URL=postgresql://stayloop:citestpassword0123456789abcdef@postgres:5432/stayloop?schema=public
          AUTH_SECRET=ci-auth-secret-0123456789abcdef0123456789abcdef
          INTEGRATION_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          REDIS_URL=redis://redis:6379
          APP_ORIGIN=https://app.example.com
          DOMAIN=app.example.com
          ACME_EMAIL=ops@example.com
          LOG_LEVEL=warn
          EOF
          # Compose builds the same targets again — acceptable in CI for a
          # true startup test. Caddy is EXCLUDED (ACME needs public DNS);
          # its configuration is exercised on the VPS (DEPLOYMENT.md).
          docker compose -f docker-compose.prod.yml up -d --build postgres redis migrate web worker
          # Wait for web readiness (migrations run first).
          for i in $(seq 1 60); do
            if docker compose -f docker-compose.prod.yml exec -T web curl -fsS http://127.0.0.1:3000/api/health; then
              echo "web READY"; break
            fi
            sleep 5
          done
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml ps web | grep -q "healthy"
          docker compose -f docker-compose.prod.yml ps worker | grep -q "healthy"

      - name: Verify worker heartbeat inside the stack
        run: |
          sleep 35
          docker compose -f docker-compose.prod.yml exec -T web \
            curl -fsS http://127.0.0.1:3000/api/health | grep -o '"worker":"ok"'

      - name: Export generation + download round-trip (in-stack)
        run: |
          # Insert a queued export job directly, let the worker process it,
          # then download it with a properly signed token (admin bootstrap
          # inside docker is covered by the PG integration suite).
          docker compose -f docker-compose.prod.yml exec -T -w /app worker bun -e '
            const { randomUUID } = require("crypto");
            const { PrismaClient } = require("@prisma/client");
            const db = new PrismaClient();
            const id = randomUUID();
            // hotelId lives in the PAYLOAD only (no FK); the handler queries
            // customers for it and writes a header-only CSV — proving the
            // worker + shared volume path end to end.
            db.backgroundJob.create({
              data: { id, type: "CSV_EXPORT", payload: JSON.stringify({ hotelId: "seed-hotel" }), status: "QUEUED", maxAttempts: 1 },
            }).then((j) => { console.log("JOB:" + j.id); return db.$disconnect(); });
          ' | tee /tmp/job.txt
          JOB_ID=$(grep -o 'JOB:.*' /tmp/job.txt | cut -d: -f2)
          test -n "$JOB_ID"
          # Wait for the worker to process it.
          for i in $(seq 1 30); do
            STATUS=$(docker compose -f docker-compose.prod.yml exec -T worker bun -e "
              const { PrismaClient } = require('@prisma/client');
              const db = new PrismaClient();
              db.backgroundJob.findUnique({ where: { id: '$JOB_ID' } }).then((j) => { console.log(j ? j.status : 'MISSING'); return db.\$disconnect(); });
            " | tail -1)
            echo "status: $STATUS"
            [ "$STATUS" = "COMPLETED" ] || [ "$STATUS" = "FAILED" ] && break
            sleep 2
          done
          test "$STATUS" = "COMPLETED"
          # The file exists on the shared exports volume.
          docker compose -f docker-compose.prod.yml exec -T worker ls -la /app/var/exports/

      - name: Backup + restore (in-stack, real pg_dump)
        run: |
          # Create a PENDING backup record; the worker claims it and runs
          # pg_dump + AES-256-GCM (postgresql-client-16 is in the image).
          docker compose -f docker-compose.prod.yml exec -T -w /app worker bun -e '
            const { PrismaClient } = require("@prisma/client");
            const db = new PrismaClient();
            db.backupRecord.create({ data: { status: "PENDING", triggerReason: "ci" } })
              .then((r) => { console.log("BACKUP:" + r.id); return db.$disconnect(); });
          ' | tee /tmp/backup.txt
          BACKUP_ID=$(grep -o 'BACKUP:.*' /tmp/backup.txt | cut -d: -f2)
          test -n "$BACKUP_ID"
          for i in $(seq 1 60); do
            RESULT=$(docker compose -f docker-compose.prod.yml exec -T worker bun -e "
              const { PrismaClient } = require('@prisma/client');
              const db = new PrismaClient();
              db.backupRecord.findUnique({ where: { id: '$BACKUP_ID' } }).then((r) => { console.log(r.status + '|' + (r.filename || '') + '|' + (r.error || '')); return db.\$disconnect(); });
            " | tail -1)
            echo "backup: $RESULT"
            case "$RESULT" in SUCCESS*|FAILED*) break;; esac
            sleep 2
          done
          case "$RESULT" in
            SUCCESS*\ verified*)
              echo "Backup completed and verified.";;
            SUCCESS*)
              echo "Backup completed.";;
            *)
              echo "Backup FAILED: $RESULT"; exit 1;;
          esac
          # The encrypted archive exists on the shared backups volume with
          # restrictive permissions.
          docker compose -f docker-compose.prod.yml exec -T worker sh -c \
            'ls -la /app/var/backups/ && test "$(find /app/var/backups -name "*.slbkp.enc" | wc -l)" -ge 1'

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v || true
